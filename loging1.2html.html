<!DOCTYPE html>

<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Bootstrap & Materialize</title>

    

    <link rel="icon" href="https://getbootstrap.com/docs/5.3/assets/img/favicons/favicon.ico">

    

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>

        body {

            display: flex;

            justify-content: center;

            align-items: center;

            height: 100vh;

            background-color: #f5f5f5;

        }

        .login-card {

            background-color: #fff;

            padding: 40px;

            border-radius: 10px;

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);

            width: 100%;

            max-width: 400px;

        }

        .login-card .card-title {

            text-align: center;

            font-size: 2.2em;

            color: #333;

            margin-bottom: 30px;

        }

        .input-field label.active {

            color: #2196f3 !important; /* Color azul de Materialize */

        }

        

        .input-field input:focus {

            border-bottom: 1px solid #2196f3 !important;

            box-shadow: 0 1px 0 0 #2196f3 !important;

        }

        .input-field .prefix.active {

            color: #2196f3 !important;

        }

        .btn-login {

            width: 100%;

            background-color: #2196f3;

            font-weight: bold;

            margin-top: 30px;

        }

        .btn-login:hover {

            background-color: #1e88e5;

        }

        .links-container {

            display: flex;

            justify-content: space-between;

            margin-top: 15px;

            font-size: 0.9em;

        }

        .links-container a {

            color: #555;

            text-decoration: none;

        }

        .links-container a:hover {

            text-decoration: underline;

        }

        

        .create-account {

            text-align: center;

            margin-top: 20px;

        }

    </style>

</head>

<body>

    <div class="login-card">

        <h3 class="card-title">Login</h3>

        <form action="#" method="post">

            <div class="input-field">

                <i class="material-icons prefix">email</i>

                <input id="email" type="email" class="validate">

                <label for="email">Email</label>

            </div>

            <div class="input-field">

                <i class="material-icons prefix">lock</i>

                <input id="password" type="password" class="validate">

                <label for="password">Password</label>

            </div>

            <div class="links-container">

                <a href="#">Forgot Password?</a>

            </div>

            <button class="btn btn-large waves-effect waves-light btn-login" type="submit" name="action">

                Login

            </button>

            

            <div class="create-account">

                <p>Don't have an account?</p>

                <a href="#" class="blue-text text-darken-2">Create New Account</a>

            </div>

        </form>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>

</html>
